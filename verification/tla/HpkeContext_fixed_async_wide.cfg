\* As HpkeContext_fixed_async.cfg with three binary digits (MaxSeq = 7), so
\* a carry spans two digits. Safety and relaxed refinement only.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 3
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = TRUE
    AsyncExnInIncrement = TRUE
    AsyncExnBeforeRelease = TRUE
    IncrementOrder = "carry_first"
    BusyRelease = "direct"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    UsedNoncesBelowSeq
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    RelaxedRefinement
    SeqNeverDecreases
    StuckIsPermanent
