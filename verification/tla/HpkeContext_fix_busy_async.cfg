\* The F2 fix alone (direct busy release, shipped increment) under
\* asynchronous exceptions after the CAS and before the release: compare
\* HpkeContext_async_cas_stuck.cfg and HpkeContext_async_release_stuck.cfg.
\* busy is always released, and the exact Refinement still holds.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = TRUE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = TRUE
    IncrementOrder = "lsb_first"
    BusyRelease = "direct"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    SeqCountsSuccesses
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    CallsReturn
    BusyReleased
    NeverBlocked
    StuckIsPermanent
