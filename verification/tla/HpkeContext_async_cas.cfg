\* Asynchronous exception between the CAS and Fun.protect (expected to PASS:
\* nonce safety, refinement and termination of every call still hold).
\* HpkeContext_async_cas_stuck.cfg shows what does NOT hold.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = TRUE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "lsb_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    NoNonceReuse
    SeqCountsSuccesses
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    CallsReturn
    NeverBlocked
    StuckIsPermanent
