\* between the CAS and Fun.protect leaves busy = TRUE forever.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = TRUE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "lsb_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

PROPERTIES
    BusyReleased
