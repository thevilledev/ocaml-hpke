\* Both fixes, with every asynchronous exception the model knows enabled.
\* Interrupted increments burn nonces, so SeqCountsSuccesses and the exact
\* Refinement do not hold (see HpkeContext_fixed_async_skips.cfg);
\* RelaxedRefinement allows exactly that and nothing else.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = TRUE
    AsyncExnInIncrement = TRUE
    AsyncExnBeforeRelease = TRUE
    IncrementOrder = "carry_first"
    BusyRelease = "direct"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    UsedNoncesBelowSeq
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    RelaxedRefinement
    SeqNeverDecreases
    CallsReturn
    BusyReleased
    NeverBlocked
    StuckIsPermanent
