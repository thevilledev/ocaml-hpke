\* The implementation as written (Mutation = "none"), no asynchronous
\* exceptions, strict safety + refinement + liveness.
\* Two domains keep the run quick; HpkeContext_3dom.cfg repeats it with
\* three domains.
\* Deadlock checking stays on: an idle domain can always start a call, so a
\* deadlock would mean a model bug.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = FALSE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "lsb_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    SeqCountsSuccesses
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    CallsReturn
    BusyReleased
    NeverBlocked
    StuckIsPermanent
