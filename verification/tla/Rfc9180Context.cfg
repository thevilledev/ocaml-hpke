\* Abstract RFC 9180 context on its own. Deadlock checking stays on: Export
\* is always enabled, so a deadlock would mean a broken Next.
CONSTANTS
    MaxSeq = 3
    RfcErrorOrder = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoncesConsumedInOrder
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    FailsAtLimit
    FailureKeepsSeq
    SeqMonotone
