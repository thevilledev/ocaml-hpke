\* MUTATION CHECK, deliberately broken receiver (expected to FAIL
\* EventuallyAccepted): a rejected open advances the receiver, so a forged
\* delivery makes the next genuine message undeliverable.
CONSTANTS
    MaxSeq = 5
    AADs = {a1, a2}
    Msgs = {m1, m2, m3}
    Mutation = "advance_on_failure"

SPECIFICATION FairSpec

PROPERTIES
    EventuallyAccepted
