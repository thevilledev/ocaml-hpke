\* The F1 fix alone (carry-first increment, shipped Fun.protect) under
\* asynchronous exceptions inside increment_sequence: compare
\* HpkeContext_async_incr.cfg. Nonce safety and relaxed refinement hold.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = FALSE
    AsyncExnInIncrement = TRUE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "carry_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    UsedNoncesBelowSeq
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    RelaxedRefinement
    SeqNeverDecreases
