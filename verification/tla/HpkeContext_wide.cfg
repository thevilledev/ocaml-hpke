\* Wider sequence: three binary digits (MaxSeq = 7), so carries cross two
\* digit boundaries. Safety and refinement only: the liveness properties do
\* not depend on the width and are checked in HpkeContext.cfg.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 3
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = FALSE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "lsb_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    SeqCountsSuccesses
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    StuckIsPermanent
