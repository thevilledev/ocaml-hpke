\* Sender and receiver over an adversarial network, the implementation's
\* receiver (Mutation = "none"). Deadlock checking stays on: the adversary
\* can always deliver something.
CONSTANTS
    MaxSeq = 5
    AADs = {a1, a2}
    Msgs = {m1, m2, m3}
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    AcceptedIsPrefixOfSealed
    RecvSeqLeSendSeq
    SeqsCountSuccesses
    NoDesync

PROPERTIES
    FailedOpenKeepsSeq
    EventuallyAccepted
