\* Both fixes (carry-first increment, direct busy release), no asynchronous
\* exceptions: every check of HpkeContext.cfg, plus UsedNoncesBelowSeq.
CONSTANTS
    Domains = {d1, d2}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = FALSE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "carry_first"
    BusyRelease = "direct"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    SeqCountsSuccesses
    UsedNoncesBelowSeq
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    CallsReturn
    BusyReleased
    NeverBlocked
    StuckIsPermanent
