\* Three domains, the implementation as written: safety, refinement and
\* liveness (about 6 minutes; HpkeContext.cfg is the quick two-domain run).
CONSTANTS
    Domains = {d1, d2, d3}
    SeqBase = 2
    SeqWidth = 2
    Ops = {"seal", "open", "export"}
    AsyncExnAtCas = FALSE
    AsyncExnInIncrement = FALSE
    AsyncExnBeforeRelease = FALSE
    IncrementOrder = "lsb_first"
    BusyRelease = "fun_protect"
    RfcErrorOrder = FALSE
    Mutation = "none"

SPECIFICATION FairSpec

INVARIANTS
    TypeOK
    MutualExclusion
    BusyIffOwner
    NotStuck
    NoNonceReuse
    SeqCountsSuccesses
    NeverUsesAllOnesNonce
    LimitErrorOnlyAtLimit

PROPERTIES
    Refinement
    SeqNeverDecreases
    StuckIsPermanent
    CallsReturn
    BusyReleased
    NeverBlocked
