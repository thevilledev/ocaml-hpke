name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: avrea-ubuntu-latest
            ocaml: "4.14"
          - os: avrea-ubuntu-latest
            ocaml: "5.2"
          - os: avrea-ubuntu-latest
            ocaml: "5.5"
          - os: avrea-macos-26-8-vcpu
            ocaml: "4.14"
          - os: avrea-macos-26-8-vcpu
            ocaml: "5.5"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam exec -- dune build @all @doc
      - run: opam exec -- dune runtest

  fuzz:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build --profile fuzz fuzz/fuzz_hpke.exe
      - name: Fuzz smoke test
        if: github.event_name != 'schedule'
        run: opam exec -- _build/default/fuzz/fuzz_hpke.exe --repeat 1000 --seed 9180
      - name: Scheduled fuzz campaign
        if: github.event_name == 'schedule'
        run: opam exec -- _build/default/fuzz/fuzz_hpke.exe --repeat 10000 --seed 9180

  packaging:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - run: opam lint hpke.opam
      - run: opam install . --with-test --with-doc

  hygiene:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-doc --with-dev-setup
      - run: opam lint hpke.opam
      - run: opam exec -- dune fmt
      - run: git diff --exit-code

  lower-bounds:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "4.14"
          dune-cache: true
      - name: Install declared lower bounds
        run: |
          opam pin add hpke.dev . --no-action
          opam install --yes \
            dune.3.12.1 \
            mirage-crypto.2.4.0 \
            mirage-crypto-ec.2.4.0 \
            mirage-crypto-rng.2.4.0 \
            curve448.0.1.0 \
            kdf.1.1.0 digestif.1.3.1 eqaf.0.10 \
            alcotest.1.7.0 qcheck-alcotest.0.25 crowbar.0.2.1 \
            yojson.2.0.0
          opam install --yes --deps-only --with-test hpke.dev
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
